# ── OpenWeatherMap ─────────────────────────────────────────────────────────────
# Find your city ID at: https://openweathermap.org/find
# Get a free API key at: https://openweathermap.org/api
openweather.city.id=REPLACE_WITH_CITY_ID
openweather.api.key=REPLACE_WITH_OPENWEATHER_API_KEY
quarkus.rest-client.openweather.url=https://api.openweathermap.org

# ── NewsAPI ────────────────────────────────────────────────────────────────────
# Get a free API key at: https://newsapi.org
news.api.key=REPLACE_WITH_NEWSAPI_KEY
news.country=de
quarkus.rest-client.newsapi.url=https://newsapi.org

# ── Quarkus ────────────────────────────────────────────────────────────────────
# Disable HTTP server — this is a desktop app, not a REST service.
quarkus.http.host-enabled=false

# Suppress Quarkus startup banner and reduce log noise for a desktop app.
quarkus.banner.enabled=false
quarkus.log.level=WARN
quarkus.log.category."main".level=INFO
