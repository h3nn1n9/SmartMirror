services:
  smartmirror:
    build: .
    image: smartmirror:latest

    # Pass the host X server to the container.
    # Before starting, run on the host:  xhost +local:docker
    environment:
      - DISPLAY=${DISPLAY:-:0}

      # API credentials — set these in your shell or in a .env file next to this file.
      # See README.md § Configuration reference for all available keys.
      - OPENWEATHER_CITY_ID=${OPENWEATHER_CITY_ID:-}
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY:-}
      - NEWS_API_KEY=${NEWS_API_KEY:-}
      - NEWS_COUNTRY=${NEWS_COUNTRY:-de}

    volumes:
      # X11 socket — required for the UI to appear on the host display
      - /tmp/.X11-unix:/tmp/.X11-unix

      # Google Calendar credentials (optional).
      # Uncomment if you have client_secret.json and want calendar integration.
      # - ./client_secret.json:/app/client_secret.json:ro

      # Persist the OAuth2 token cache so the browser flow only runs once.
      # - ${HOME}/.credentials:/root/.credentials

    # Use the host network stack so the OAuth2 redirect receiver (Jetty) can
    # bind a local port that the browser redirect lands on.
    network_mode: host

    restart: unless-stopped
